services:
  cookie-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cookie-ai
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PORT=8000
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
